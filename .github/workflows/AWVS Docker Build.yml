name: AWVS Docker Build

on:
  workflow_dispatch:
    inputs:
      PACKAGE_URL:
        description: 'AWVS INSTALLATION PACKAGE'
        required: true
        default: "old"
      PACKAGE_VERSION:
        description: 'AWVS PACKAGE VERSION'
        required: true
        default: "old"
  watch:
    types: started
env:
  PACKAGE_VERSION: ${{ github.event.inputs.PACKAGE_VERSION }}
jobs:
  AWVS_Docker_Build:
    name: AWVS Docker Build
    runs-on: ubuntu-latest
    steps:
      -
        name: Private Actions Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.18.0-rc.1'
      -
        name: Update Readme
        if: github.event.inputs.PACKAGE_VERSION != 'old'
        id: update
        run: |
          # apt-get install coreutils
          cd acunetix/README
          md5_now="$(md5sum ../../README.md)"
          go run main.go -v "${{ github.event.inputs.PACKAGE_VERSION }}"
          if [ "$md5_now" != "$(md5sum ../../README.md)" ]; then
            echo "status=false" >> $GITHUB_OUTPUT
          else
            echo "status=true" >> $GITHUB_OUTPUT
          fi
          cd ../../
      -
        name: Update version tag
        if: github.event.inputs.PACKAGE_VERSION == 'old'
        id: update_tag
        run: |
          VERSION="$((cat acunetix/README/LAST_VERSION | sed 's/ //g') 2>/dev/null)"
          if [[ -z "{$VERSION}" ]]; then
            echo "获取老版本失败: ${VERSION}"
          fi
          echo "PACKAGE_VERSION=${VERSION}" >> $GITHUB_ENV
      -
        name: Upload AWVS INSTALLATION PACKAGE
        if: github.event.inputs.PACKAGE_URL != 'old'
        run: |
          cd acunetix/AWVS_INSTALLATION_PACKAGE || exit 1
          curl -Lko awvs_x86.sh "${{ github.event.inputs.PACKAGE_URL }}" || exit 1
          split -b 50m awvs_x86.sh
      -
        name: Update AWVS
        if: github.event.inputs.PACKAGE_URL != 'old' || steps.update.outputs.status == 'false'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add --all -- ':!acunetix/AWVS_INSTALLATION_PACKAGE/awvs_x86.sh'
          git commit -m "Add changes by Awvs_Update_Action" -a
          git push
      -
        name: Docker Setup QEMU
        uses: docker/setup-qemu-action@v3
      -
        name: Docker Setup Buildx
        uses: docker/setup-buildx-action@v3
      -
        name: Docker Login in Aliyun
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKERHUB_REGISTRY_ALIYUN }}
          username: ${{ secrets.DOCKERHUB_ACCOUNT_ALIYUN }}
          password: ${{ secrets.DOCKERHUB_PASSWORD_ALIYUN }}
      -
        name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.TOKEN_GITHUB }}
      -
        name: Build and push Docker images
        uses: docker/build-push-action@v6
        with:
          context: .
          # platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPO }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPO }}:${{ env.PACKAGE_VERSION }}
            ghcr.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPO }}:latest
            ghcr.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPO }}:${{ env.PACKAGE_VERSION }}
            ${{ secrets.DOCKERHUB_REGISTRY_ALIYUN }}/${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPO }}:latest
            ${{ secrets.DOCKERHUB_REGISTRY_ALIYUN }}/${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPO }}:${{ env.PACKAGE_VERSION }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPO }}:cache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPO }}:cache,mode=max
      # -
      #   name: Scan for vulnerabilities
      #   uses: crazy-max/ghaction-container-scan@v1
      #   with:
      #     image: ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPO }}:latest
      #     dockerfile: Dockerfile
      #   env:
      #     TRIVY_TIMEOUT: 20m
      -
        name: Send notification to Feishu
        uses: XRSec/feishu-bot-webhook-action@v1
        with:
          FEISHU_BOT_WEBHOOK: ${{ secrets.FEISHU_BOT_WEBHOOK }}
          FEISHU_BOT_SIGNKEY: ${{ secrets.FEISHU_BOT_SIGNKEY }}

  Repository_Dispatch:
    needs: AWVS_Docker_Build
    runs-on: ubuntu-latest
    steps:
      -
        name: Repository Dispatch
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.TOKEN_GITHUB }}
          repository: ${{ github.repository_owner }}/AWVS-Update
          event-type: Awvs_Update_Action
          client-payload: '{"ref": "${{ github.ref }}", "sha": "${{ github.sha }}"}'
